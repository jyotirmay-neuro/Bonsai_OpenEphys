name: package-bonsai

on:
  workflow_dispatch:   # manual only (test-release phase: conserve Actions minutes)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - name: Build native liboeconnect
        shell: bash
        run: |
          cmake -S libshared/oeconnect -B libshared/oeconnect/build -DCMAKE_BUILD_TYPE=Release -DOEC_BUILD_TESTS=OFF
          cmake --build libshared/oeconnect/build --config Release --parallel
      - name: Restore
        run: dotnet restore package-bonsai/Bonsai.OEconnect/Bonsai.OEconnect.slnx
      - name: Build
        run: dotnet build package-bonsai/Bonsai.OEconnect/Bonsai.OEconnect.slnx -c Release --no-restore
      - name: Test
        run: dotnet test package-bonsai/Bonsai.OEconnect/Bonsai.OEconnect.slnx -c Release --no-build --verbosity normal
