name: plugin-openephys

# workflow_dispatch so it can be run on demand; also on pushes/PRs that touch the
# plugin so regressions are caught. The heavy loadable-plugin job builds the whole
# Open Ephys GUI, which is slow but free on a public repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugin-openephys/**'
      - 'libshared/**'
      - '.github/workflows/plugin-openephys.yml'
  pull_request:
    paths:
      - 'plugin-openephys/**'
      - 'libshared/**'
      - '.github/workflows/plugin-openephys.yml'

jobs:
  # Fast: the pure hot-path unit tests. Builds liboeconnect + libzmq statically,
  # no GUI. This is the top-level CMakeLists (tests only, no loadable plugin).
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S plugin-openephys/OEconnect -B build -DCMAKE_BUILD_TYPE=Release -DOEC_PLUGIN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Heavy: the actual loadable plugin, built the two-stage way (GUI -> plugin)
  # against the vendored plugin-GUI (API v10). Produces the binary users install.
  loadable-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10
          chmod +x plugin-openephys/OEconnect/external/plugin-GUI/Resources/Scripts/install_linux_dependencies.sh
          sudo plugin-openephys/OEconnect/external/plugin-GUI/Resources/Scripts/install_linux_dependencies.sh

      - name: Build plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: plugin-openephys/OEconnect
        run: ./build-oe-plugin.ps1 -Config Release

      - name: Build plugin (Linux)
        if: runner.os == 'Linux'
        working-directory: plugin-openephys/OEconnect
        env:
          CC: gcc-10
          CXX: g++-10
        run: |
          chmod +x build-oe-plugin.sh
          ./build-oe-plugin.sh --config Release

      - name: Build plugin (macOS)
        if: runner.os == 'macOS'
        working-directory: plugin-openephys/OEconnect
        run: |
          chmod +x build-oe-plugin.sh
          ./build-oe-plugin.sh --config Release

      # --- second variant: API v8 (GUI 0.6.x) from a separate 0.6.7 checkout ---
      # The build scripts key their output on the GUI's PLUGIN_API_VER, so the
      # v8 binary lands in dist-oe-plugin/api-v8/ alongside api-v10/ and the one
      # per-OS artifact carries both. A GUI loads only the api-vN matching itself.
      - name: Build plugin v8 (Windows, GUI 0.6.x)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: plugin-openephys/OEconnect
        run: |
          git clone --depth 1 --branch v0.6.7 --recurse-submodules https://github.com/open-ephys/plugin-GUI.git "$env:RUNNER_TEMP/plugin-GUI-v8"
          ./build-oe-plugin.ps1 -Config Release -GuiDir "$env:RUNNER_TEMP/plugin-GUI-v8"

      - name: Build plugin v8 (Linux, GUI 0.6.x)
        if: runner.os == 'Linux'
        working-directory: plugin-openephys/OEconnect
        env:
          CC: gcc-10
          CXX: g++-10
        run: |
          # 0.6.x uses JUCE 6, whose WebBrowser component needs webkit2gtk-4.0;
          # the 1.0.x submodule (JUCE 8) uses 4.1, so this is the v8-only delta.
          sudo apt-get install -y libwebkit2gtk-4.0-dev
          git clone --depth 1 --branch v0.6.7 --recurse-submodules https://github.com/open-ephys/plugin-GUI.git "$RUNNER_TEMP/plugin-GUI-v8"
          ./build-oe-plugin.sh --config Release --gui-dir "$RUNNER_TEMP/plugin-GUI-v8"

      - name: Build plugin v8 (macOS, GUI 0.6.x)
        if: runner.os == 'macOS'
        working-directory: plugin-openephys/OEconnect
        run: |
          git clone --depth 1 --branch v0.6.7 --recurse-submodules https://github.com/open-ephys/plugin-GUI.git "$RUNNER_TEMP/plugin-GUI-v8"
          ./build-oe-plugin.sh --config Release --gui-dir "$RUNNER_TEMP/plugin-GUI-v8"

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: OEconnect-plugin-${{ runner.os }}
          path: plugin-openephys/OEconnect/dist-oe-plugin/**
          if-no-files-found: error
