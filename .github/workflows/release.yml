name: release

# Tag push builds and publishes a full cross-OS artifact set. workflow_dispatch
# builds the same set without cutting a release, for dry runs.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release from the built artifacts'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  protocol-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Re-run drift check before any artifact is built
        run: bash ci/check-drift.sh

  # Native liboeconnect for each OS, consumed by the Bonsai NuGet package.
  build-libshared:
    needs: protocol-compat
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S libshared/oeconnect -B build -DCMAKE_BUILD_TYPE=Release -DOEC_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          # POSIX shared libs land at the build root; MSVC emits oeconnect.dll
          # (no 'lib' prefix) under build/Release.
          cp build/liboeconnect.so     out/ 2>/dev/null || true
          cp build/liboeconnect.dylib  out/ 2>/dev/null || true
          cp build/Release/oeconnect.dll out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: liboeconnect-${{ runner.os }}
          path: out/
          if-no-files-found: error

  # The loadable OE GUI plugin, built two-stage (GUI -> plugin) on each OS.
  build-plugin:
    needs: protocol-compat
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10
          chmod +x plugin-openephys/OEconnect/external/plugin-GUI/Resources/Scripts/install_linux_dependencies.sh
          sudo plugin-openephys/OEconnect/external/plugin-GUI/Resources/Scripts/install_linux_dependencies.sh

      - name: Build plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: plugin-openephys/OEconnect
        run: ./build-oe-plugin.ps1 -Config Release

      - name: Build plugin (Linux)
        if: runner.os == 'Linux'
        working-directory: plugin-openephys/OEconnect
        env: { CC: gcc-10, CXX: g++-10 }
        run: |
          chmod +x build-oe-plugin.sh
          ./build-oe-plugin.sh --config Release

      - name: Build plugin (macOS)
        if: runner.os == 'macOS'
        working-directory: plugin-openephys/OEconnect
        run: |
          chmod +x build-oe-plugin.sh
          ./build-oe-plugin.sh --config Release

      # --- second variant: API v8 (GUI 0.6.x). Keyed on the checkout's
      # PLUGIN_API_VER, so it writes dist-oe-plugin/api-v8/ next to api-v10/ and
      # the per-OS zip ships both. See docs/oe-version-compatibility.md.
      - name: Build plugin v8 (Windows, GUI 0.6.x)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: plugin-openephys/OEconnect
        run: |
          git clone --depth 1 --branch v0.6.7 --recurse-submodules https://github.com/open-ephys/plugin-GUI.git "$env:RUNNER_TEMP/plugin-GUI-v8"
          ./build-oe-plugin.ps1 -Config Release -GuiDir "$env:RUNNER_TEMP/plugin-GUI-v8"

      - name: Build plugin v8 (Linux, GUI 0.6.x)
        if: runner.os == 'Linux'
        working-directory: plugin-openephys/OEconnect
        env: { CC: gcc-10, CXX: g++-10 }
        run: |
          # 0.6.x uses JUCE 6, whose WebBrowser component needs webkit2gtk-4.0;
          # the 1.0.x submodule (JUCE 8) uses 4.1, so this is the v8-only delta.
          sudo apt-get install -y libwebkit2gtk-4.0-dev
          git clone --depth 1 --branch v0.6.7 --recurse-submodules https://github.com/open-ephys/plugin-GUI.git "$RUNNER_TEMP/plugin-GUI-v8"
          ./build-oe-plugin.sh --config Release --gui-dir "$RUNNER_TEMP/plugin-GUI-v8"

      - name: Build plugin v8 (macOS, GUI 0.6.x)
        if: runner.os == 'macOS'
        working-directory: plugin-openephys/OEconnect
        run: |
          git clone --depth 1 --branch v0.6.7 --recurse-submodules https://github.com/open-ephys/plugin-GUI.git "$RUNNER_TEMP/plugin-GUI-v8"
          ./build-oe-plugin.sh --config Release --gui-dir "$RUNNER_TEMP/plugin-GUI-v8"

      - uses: actions/upload-artifact@v7
        with:
          name: OEconnect-plugin-${{ runner.os }}
          path: plugin-openephys/OEconnect/dist-oe-plugin/**
          if-no-files-found: error

  # Bonsai NuGet package with the native lib for all three OS embedded.
  pack-bonsai:
    needs: build-libshared
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Stage runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path libshared/oeconnect/build/Release | Out-Null
          # csproj packs win-x64 from build/Release/oeconnect.dll and the POSIX
          # libs from the build root.
          Copy-Item artifacts/liboeconnect-Windows/oeconnect.dll   libshared/oeconnect/build/Release/ -ErrorAction Stop
          Copy-Item artifacts/liboeconnect-Linux/liboeconnect.so    libshared/oeconnect/build/ -ErrorAction Stop
          Copy-Item artifacts/liboeconnect-macOS/liboeconnect.dylib libshared/oeconnect/build/ -ErrorAction Stop
      - name: Promote Unshipped -> Shipped
        run: bash ci/promote-api.sh
      - name: Pack
        run: dotnet pack package-bonsai/Bonsai.OEconnect/src/Bonsai.OEconnect/Bonsai.OEconnect.csproj -c Release -o package-bonsai/nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: Bonsai.OEconnect-nupkg
          path: package-bonsai/nupkg/
          if-no-files-found: error

  publish:
    needs: [build-plugin, pack-bonsai]
    # Only on a tag push, or a manual run that opted in.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Bundle release assets
        run: |
          mkdir -p release
          ( cd artifacts/OEconnect-plugin-Linux   && zip -r ../../release/OEconnect-plugin-linux.zip   . )
          ( cd artifacts/OEconnect-plugin-Windows && zip -r ../../release/OEconnect-plugin-windows.zip . )
          ( cd artifacts/OEconnect-plugin-macOS   && zip -r ../../release/OEconnect-plugin-macos.zip   . )
          cp artifacts/Bonsai.OEconnect-nupkg/*.nupkg release/
          ls -la release/
      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body_path: docs/release-notes/RELEASE_TEMPLATE.md
      - name: Publish to NuGet.org
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true   # a missing NUGET_API_KEY must not fail the release
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set; skipping NuGet publish."
            exit 0
          fi
          for f in release/*.nupkg; do
            dotnet nuget push "$f" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
          done
